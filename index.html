<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우성자동문Class | 점검 중</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-3%, 2%); }
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
            max-width: 520px;
        }

        /* Gear animation */
        .icon-wrap {
            margin-bottom: 2.5rem;
            position: relative;
            display: inline-block;
        }

        .gear {
            width: 72px;
            height: 72px;
            fill: none;
            stroke: #3b82f6;
            stroke-width: 2;
            animation: spin 8s linear infinite;
        }

        .gear-small {
            width: 44px;
            height: 44px;
            stroke: #8b5cf6;
            position: absolute;
            right: -18px;
            bottom: -8px;
            animation: spin-reverse 6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spin-reverse { to { transform: rotate(-360deg); } }

        .brand {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .message {
            font-size: 1.05rem;
            font-weight: 300;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* Pulse dot */
        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #64748b;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #f59e0b;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <!-- Main gear -->
            <svg class="gear" viewBox="0 0 64 64">
                <path d="M32 20a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm0 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16z"/>
                <path d="M30 4h4l1.5 7.2a22 22 0 0 1 5.6 2.3L47.8 9l2.8 2.8-4.5 6.7a22 22 0 0 1 2.3 5.6L55.6 26v4l-7.2 1.5a22 22 0 0 1-2.3 5.6l4.5 6.7-2.8 2.8-6.7-4.5a22 22 0 0 1-5.6 2.3L34 51.6h-4l-1.5-7.2a22 22 0 0 1-5.6-2.3L16.2 46.6l-2.8-2.8 4.5-6.7a22 22 0 0 1-2.3-5.6L8.4 30v-4l7.2-1.5a22 22 0 0 1 2.3-5.6L13.4 12.2l2.8-2.8 6.7 4.5a22 22 0 0 1 5.6-2.3L30 4z"/>
            </svg>
            <!-- Small gear -->
            <svg class="gear gear-small" viewBox="0 0 64 64">
                <path d="M32 22a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/>
                <path d="M30 4h4l1.5 7.2a22 22 0 0 1 5.6 2.3L47.8 9l2.8 2.8-4.5 6.7a22 22 0 0 1 2.3 5.6L55.6 26v4l-7.2 1.5a22 22 0 0 1-2.3 5.6l4.5 6.7-2.8 2.8-6.7-4.5a22 22 0 0 1-5.6 2.3L34 51.6h-4l-1.5-7.2a22 22 0 0 1-5.6-2.3L16.2 46.6l-2.8-2.8 4.5-6.7a22 22 0 0 1-2.3-5.6L8.4 30v-4l7.2-1.5a22 22 0 0 1 2.3-5.6L13.4 12.2l2.8-2.8 6.7 4.5a22 22 0 0 1 5.6-2.3L30 4z"/>
            </svg>
        </div>

        <div class="brand">우성자동문Class</div>

        <h1>문제가 발생하였습니다</h1>

        <p class="message">
            현재 사이트에 일시적인 문제가 발생하여<br>
            점검을 진행하고 있습니다.<br>
            신속히 복구하겠습니다.
        </p>

        <div class="status">
            <span class="dot"></span>
            복구 작업 진행 중
        </div>
    </div>
</body>
</html>
